<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ペンギンワールド V65 復活完全版</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eff6ff;font-family:system-ui,sans-serif;color:#172554}#g{max-width:900px;margin:auto;padding:7px;display:grid;gap:7px}button{border:1px solid #93c5fd;border-radius:10px;background:#dbeafe;color:#172554;padding:8px 4px;font-weight:900;touch-action:manipulation}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.map button{min-height:68px}.screen{position:relative;aspect-ratio:800/420;overflow:hidden;border-radius:13px}canvas{display:block;width:100%;height:100%}.ov{position:absolute;inset:0;background:#13233de8;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:9px;text-align:center;padding:12px;z-index:5}.ov button{background:#fde68a}.party{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px}.panel{border:2px solid var(--pc);border-radius:9px;padding:4px;display:grid;gap:4px}.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.ctrl button{min-height:40px}.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.slots button{min-height:34px;padding:3px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}</style></head>
<body><div id="g">
<div id="map"><h2 style="text-align:center;margin:5px">🐧 ペンギンワールド V65・復活完全版</h2><div id="status" style="text-align:center;font-weight:900"></div><div style="display:flex;gap:5px"><button id="prev">⬅️ 前</button><b id="page" style="flex:1;text-align:center;padding:8px"></b><button id="next">次 ➡️</button></div><div id="stages" class="map"></div><button id="latest">🔑 さいしんのステージへ</button></div>
<div id="game" style="display:none;gap:6px"><div style="display:flex;gap:4px"><button id="back" style="flex:1">🗺️ ステージ</button><button id="music" style="flex:1">🎵 ON</button><button id="pause" style="flex:1">⏸️</button></div><div style="display:flex;justify-content:space-between;font-weight:900;font-size:12px"><span id="stage"></span><span id="weather"></span><span id="score"></span></div><div class="screen"><canvas id="cv" width="800" height="420"></canvas><div id="ov" class="ov"><div id="oi" style="font-size:42px"></div><b id="ot" style="font-size:23px"></b><div id="od"></div><div id="ob" style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center"></div></div></div><div id="party" class="party"></div><div id="msg" style="text-align:center;font-weight:900;min-height:25px">🐧 ステージをえらぼう！</div></div></div>
<script>
(()=>{const $=x=>document.getElementById(x),c=$('cv').getContext('2d'),bosses=[['🦀','キング・カニ'],['🧊','アイスゴーレム'],['🐋','キングシャチ'],['🐧','ダークペンギン'],['🧙‍♀️','ダーク魔女'],['🐳','巨大シャチ'],['🐸','パックンチョ'],['🍌','バナナマン'],['🤖','巨大ロボット'],['👿','悪ロボット']],worlds=[['❄️','こおり','#60a5fa','#e0f2fe'],['🌋','火山','#fb923c','#fef3c7'],['🌙','夜の森','#172554','#818cf8'],['🍭','おかし','#f9a8d4','#fce7f3'],['🌊','海','#0ea5e9','#a5f3fc'],['🪐','宇宙','#1e1b4b','#6366f1'],['🌴','ジャングル','#4ade80','#dcfce7'],['☃️','雪の夜','#334155','#94a3b8']],cols=['#16a34a','#2563eb','#ec4899'],foods=[['🍖',4],['🍞',3],['🐠',5],['🍓',3],['🍦',5]],items=[['🧊','ice'],['🏹','bow'],['❤️','heal'],['🛡️','shield'],['⭐','star'],['⚔️','sword'],['🤖','ally']];
let unlock=1,done=new Set(),pg=0,st=1,mode='map',phase='run',ps=[],os=[],shots=[],bags=[],boss=null,score=0,prog=0,len=2200,t=0,spawn=0,world=worlds[0],weather='',music=true,audio=null,mel=0,resp=0,bossSaved=false;
try{let s=JSON.parse(localStorage.getItem('pw65-save')||localStorage.getItem('pw64-save')||localStorage.getItem('pw62-save')||localStorage.getItem('pw61-save')||'null');if(s){unlock=Math.max(1,+s.unlocked||1);done=new Set(s.cleared||[])}}catch(e){}
const save=()=>localStorage.setItem('pw65-save',JSON.stringify({unlocked:unlock,cleared:[...done]})),say=x=>$('msg').textContent=x,hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function drawMap(){$('status').textContent='🔑 '+unlock+' / 3000 ステージ かいほう！';$('page').textContent=(pg*20+1)+'〜'+(pg*20+20);$('prev').disabled=!pg;$('next').disabled=pg===149;$('stages').innerHTML=Array.from({length:20},(_,i)=>{let n=pg*20+i+1,b=bosses[(n-1)%10];return `<button data-s="${n}" ${n>unlock?'disabled':''}>${n>unlock?'🔒':b[0]}<br><b>${n}</b><br>${done.has(n)?'🏆 クリア':n>unlock?'ロック':'🔓 あそぶ'}</button>`}).join('')}
$('prev').onclick=()=>{pg--;drawMap()};$('next').onclick=()=>{pg++;drawMap()};$('latest').onclick=()=>{pg=Math.floor((unlock-1)/20);drawMap()};$('back').onclick=back;
$('stages').onclick=e=>{let b=e.target.closest('[data-s]');if(!b||b.disabled)return;st=+b.dataset.s;$('map').style.display='none';$('game').style.display='grid';let bo=bosses[(st-1)%10];overlay('🐧⚔️'+bo[0],'ステージ '+st,'ボス：'+bo[1]+'　🎲 毎回ランダム！',[['🐧 1人',()=>start(1,0)],['🐧🐧 2人',()=>start(2,0)],['🐧🐧🐧 3人',()=>start(3,0)],['🤖 CPU1',()=>start(1,1)],['🤖🤖 CPU2',()=>start(1,2)]])};
function back(){mode='map';$('game').style.display='none';$('map').style.display='block';drawMap()}
function overlay(i,t,d,bs){$('ov').style.display='flex';$('oi').textContent=i;$('ot').textContent=t;$('od').textContent=d;$('ob').innerHTML='';bs.forEach(([x,f])=>{let b=document.createElement('button');b.textContent=x;b.onclick=f;$('ob').appendChild(b)})}
function tone(f){if(!music)return;try{audio??=new(AudioContext||webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);o.stop(audio.currentTime+.16)}catch(e){}}
function P(i,bot){return{i,bot,x:100+i*52,y:289,w:42,h:51,vy:0,hp:5,inv:80,jumps:2,level:1,fish:0,down:false,bag:Array(5).fill(null),sel:-1,ammo:0,shield:false,star:0,k:{l:0,r:0,d:0},cd:0}}
function start(n,b){world=worlds[Math.floor(Math.random()*worlds.length)];weather=['☀️ はれ','🌧️ あめ','❄️ ゆき','🌈 にじ','🌪️ かぜ','🌙 くらやみ'][Math.floor(Math.random()*6)];len=1850+Math.random()*900;ps=Array.from({length:n+b},(_,i)=>P(i,i>=n));mode='play';phase='run';score=prog=t=spawn=resp=0;os=[];shots=[];bags=[];boss=null;bossSaved=false;$('ov').style.display='none';panels();say('🎒 カバンでもアイテムをゲットできるで！');hud()}
function panels(){$('party').style.setProperty('--n',ps.length);$('party').innerHTML=ps.map(p=>`<div class="panel" style="--pc:${cols[p.i]}"><b style="text-align:center">${p.bot?'🤖 CPU':'🐧 '+(p.i+1)+'P'} <span id="hp${p.i}"></span></b><div id="lv${p.i}" style="text-align:center">LV.1 🐟0/6</div>${p.bot?'<div style="text-align:center">🤖 じどうそうさ</div>':`<button id="rev${p.i}" style="display:none;background:#bbf7d0">❤️ 生き返る！</button><div class="ctrl" id="ctrl${p.i}"><button id="l${p.i}">⬅️</button><button id="j${p.i}">⬆️</button><button id="r${p.i}">➡️</button><button id="d${p.i}">⬇️</button><button id="a${p.i}">⚔️</button><button id="b${p.i}">🎒</button></div><div class="slots">${[0,1,2,3,4].map(j=>`<button id="s${p.i}${j}">＋</button>`).join('')}</div><div class="actions"><button id="eat${p.i}">😋 食べる</button><button id="pick${p.i}">🫴 拾う</button></div>`}</div>`).join('');ps.forEach(p=>{if(p.bot)return;['l','r','d'].forEach(k=>{let b=$(k+p.i);b.onpointerdown=e=>{e.preventDefault();p.k[k]=1};['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>p.k[k]=0))});$('j'+p.i).onclick=()=>jump(p);$('a'+p.i).onclick=()=>attack(p);$('b'+p.i).onclick=()=>throwBag(p);$('eat'+p.i).onclick=()=>eat(p);$('pick'+p.i).onclick=()=>manualPick(p);$('rev'+p.i).onclick=()=>revive(p);[0,1,2,3,4].forEach(j=>$('s'+p.i+j).onclick=()=>slot(p,j))})}
function hud(){$('stage').textContent='🌎 STAGE '+st+ (bossSaved?' 🚩':'');$('weather').textContent=world[0]+' '+weather;$('score').textContent='⭐ '+Math.floor(score);ps.forEach(p=>{if(!$('hp'+p.i))return;$('hp'+p.i).textContent=p.down?'💀':'❤️'+p.hp+'/5';$('lv'+p.i).textContent='LV.'+p.level+(p.level<2?' 🐟'+p.fish+'/6':' ✨');if(!p.bot){$('rev'+p.i).style.display=p.down?'block':'none';$('ctrl'+p.i).style.display=p.down?'none':'grid';[0,1,2,3,4].forEach(j=>$('s'+p.i+j).textContent=p.bag[j]?.emoji||'＋')}})}
function jump(p){if(!p.down&&p.jumps){p.vy=-13;p.jumps--}}
function attack(p){if(p.down||p.cd)return;p.cd=20;shots.push({x:p.x+40,y:p.y+15,w:28,h:18,v:19,owner:p.i});tone(520)}
function throwBag(p){if(p.down)return;bags.push({x:p.x+38,y:p.y+7,w:44,h:36,v:18,life:65,owner:p.i});say('🎒 カバンをなげた！')}
function pickup(p,o,bag=false){let j=p.bag.findIndex(x=>!x);if(j<0){if(!p.bot)say('🎒 バッグがいっぱい！');return false}p.bag[j]=o.kind==='food'?{type:'food',emoji:o.data[0],heal:o.data[1]}:{type:'item',emoji:o.data[0],kind:o.data[1]};o.dead=1;say('🎒 '+p.bag[j].emoji+(bag?' カバンでゲット！':' ゲット！'));tone(880);return true}
function manualPick(p){let o=os.find(o=>!o.dead&&(o.kind==='food'||o.kind==='item')&&Math.abs(o.x-p.x)<100);if(o)pickup(p,o);else say('🫴 近くにアイテムがないで！')}
function autoPick(){os.forEach(o=>{if(o.dead||!['food','item'].includes(o.kind))return;for(let p of ps)if(!p.down&&Math.abs(p.x-o.x)<50&&Math.abs(p.y-o.y)<60&&pickup(p,o))break})}
function slot(p,j){let o=p.bag[j];if(!o)return;p.sel=j;if(o.type==='item'){p.bag[j]=null;if(o.kind==='heal')p.hp=Math.min(5,p.hp+2);else if(o.kind==='shield')p.shield=true;else if(o.kind==='star')p.star=300;else p.ammo+=4;say('✨ '+o.emoji+' をつかった！')}hud()}
function eat(p){let j=p.sel>=0&&p.bag[p.sel]?.type==='food'?p.sel:p.bag.findIndex(x=>x?.type==='food');if(j<0)return say('🍖 ごはんがないで！');if(p.hp>=5)return say('❤️ HPいっぱい！');p.hp=Math.min(5,p.hp+p.bag[j].heal);say('😋 '+p.bag[j].emoji+' をたべた！');p.bag[j]=null;p.sel=-1;hud()}
function hurt(p){if(p.inv||p.star||p.down)return;if(p.shield){p.shield=false;p.inv=60;return}p.hp--;p.inv=80;if(p.hp<=0){p.hp=0;p.down=true;if(phase==='boss'&&ps.every(q=>q.down)){resp=100;say('💀 全員ダウン！ 🚩 ボス前から復活！')}}hud()}
function revive(p){if(!p||!p.down||mode!=='play'||resp)return;p.down=false;p.hp=5;p.inv=120;p.vy=0;p.jumps=2;p.k={l:0,r:0,d:0};if(phase==='boss'&&bossSaved){p.x=100+p.i*52;p.y=289;say('🚩 '+(p.i+1)+'P ボス前から生き返った！')}else{p.x=100+p.i*52;p.y=289;say('❤️ '+(p.i+1)+'P 生き返った！')}hud()}
function beginBoss(){phase='boss';bossSaved=true;os=[];shots=[];bags=[];ps.forEach(p=>{p.down=false;p.hp=5;p.inv=100;p.level=Math.max(2,p.level);p.x=100+p.i*52;p.y=289});let b=bosses[(st-1)%10];boss={emoji:b[0],name:b[1],x:650,y:210,w:110,h:110,hp:10+Math.floor(st/20)+ps.length*2,max:0,wait:80};boss.max=boss.hp;say('🚩 ボス前セーブ！ 👑 '+b[1]+'！');hud()}
function bossRespawn(){let max=boss?boss.max:10+Math.floor(st/20)+ps.length*2,b=bosses[(st-1)%10];os=[];shots=[];bags=[];ps.forEach(p=>{p.down=false;p.hp=5;p.inv=120;p.level=Math.max(2,p.level);p.x=100+p.i*52;p.y=289;p.vy=0});boss={emoji:b[0],name:b[1],x:650,y:210,w:110,h:110,hp:max,max,wait:100};phase='boss';say('🚩 ボス前から復活！ 👑 ボスHPも満タン！');hud()}
function spawnThing(){let r=Math.random();if(r<.32)os.push({kind:'enemy',data:['👾'],x:820,y:300,w:38,h:38});else if(r<.62)os.push({kind:'fish',x:820,y:300,w:30,h:25});else if(r<.82)os.push({kind:'food',data:foods[Math.floor(Math.random()*foods.length)],x:820,y:295,w:36,h:36});else os.push({kind:'item',data:items[Math.floor(Math.random()*items.length)],x:820,y:290,w:36,h:36})}
function ai(p){if(p.down){if(phase!=='boss'||!ps.every(q=>q.down)){if(t%180===0)revive(p)}return;}p.k.r=p.x<150;if(t%80===p.i*11)jump(p);if(phase==='boss'&&t%35===p.i*7)attack(p);if(p.hp<4)eat(p)}
function update(){if(mode!=='play')return;t++;if(resp){if(!--resp)bossRespawn();return}if(music&&t%28===0)tone([659,784,880,784,659,523][mel++%6]);let speed=5.5;prog+=phase==='run'?speed:0;score+=.15*speed;ps.forEach(p=>{if(p.inv)p.inv--;if(p.star)p.star--;if(p.cd)p.cd--;if(p.bot)ai(p);if(p.down)return;if(p.k.l)p.x-=5.7;if(p.k.r)p.x+=5.7;p.x=Math.max(10,Math.min(610,p.x));p.vy+=.65;p.y+=p.vy;if(p.y+p.h>=340){p.y=340-p.h;p.vy=0;p.jumps=2}});if(phase==='run'){if(++spawn>50){spawn=0;spawnThing()}if(prog>=len)beginBoss()}else if(boss&&--boss.wait<=0){os.push({kind:'bullet',data:['🔥'],x:boss.x,y:305,w:38,h:34,v:10});boss.wait=75}
os.forEach(o=>{if(o.dead)return;o.x-=o.kind==='bullet'?o.v:speed;if(['enemy','bullet'].includes(o.kind))ps.forEach(p=>{if(!p.down&&hit(p,o)){o.dead=1;hurt(p)}});if(o.kind==='fish')ps.some(p=>{if(!p.down&&hit(p,o)){o.dead=1;if(p.level<2&&++p.fish>=6){p.level=2;p.fish=0;say('🎉 LEVEL UP！')}score+=100;return true}})});
bags.forEach(b=>{let old=b.x;b.x+=b.v;b.life--;let p=ps[b.owner];for(let o of os){if(o.dead||!['food','item'].includes(o.kind))continue;let sweep={x:Math.min(old,b.x)-12,y:b.y-16,w:Math.abs(b.x-old)+b.w+24,h:b.h+32};if(hit(sweep,o)){pickup(p,o,true);b.dead=1;break}}if(!b.life||b.x>850)b.dead=1});autoPick();
shots.forEach(s=>{s.x+=s.v;if(boss&&hit(s,boss)){s.dead=1;if(--boss.hp<=0){done.add(st);unlock=Math.max(unlock,Math.min(3000,st+1));save();mode='clear';overlay('🏆🐧','ステージ '+st+' クリア！','🔑 次のステージがひらいた！',[['🗺️ ステージへ',back],['🎲 もう1回',()=>start(ps.filter(x=>!x.bot).length,ps.filter(x=>x.bot).length)],...(st<3000?[['➡️ つぎへ',()=>{st++;start(ps.filter(x=>!x.bot).length,ps.filter(x=>x.bot).length)}]]:[])])}}else for(let o of os)if(o.kind==='enemy'&&!o.dead&&hit(s,o)){s.dead=o.dead=1;score+=100;break}});os=os.filter(o=>!o.dead&&o.x>-60);bags=bags.filter(b=>!b.dead);shots=shots.filter(s=>!s.dead&&s.x<850);if(t%8===0)hud()}
function peng(p){c.fillStyle=cols[p.i];c.beginPath();c.ellipse(p.x+21,p.y+25,21,25,0,0,7);c.fill();c.fillStyle='white';c.beginPath();c.ellipse(p.x+25,p.y+30,13,16,0,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.arc(p.x+29,p.y+13,3,0,7);c.fill()}
function draw(){if(mode==='map')return;let g=c.createLinearGradient(0,0,0,420);g.addColorStop(0,world[2]);g.addColorStop(1,world[3]);c.fillStyle=g;c.fillRect(0,0,800,420);c.fillStyle='#dbeafe';c.fillRect(0,340,800,80);if(bossSaved){c.font='30px sans-serif';c.fillText('🚩',15,330)}os.forEach(o=>{c.font='32px sans-serif';c.fillText(o.kind==='fish'?'🐟':o.data[0],o.x,o.y+29)});bags.forEach(b=>{c.font='38px sans-serif';c.fillText('🎒',b.x,b.y+30)});shots.forEach(s=>{c.font='27px sans-serif';c.fillText('💫',s.x,s.y+22)});if(boss){c.font='80px sans-serif';c.fillText(boss.emoji,boss.x,boss.y+85);c.fillStyle='#334155';c.fillRect(220,30,360,20);c.fillStyle='#ef4444';c.fillRect(223,33,354*boss.hp/boss.max,14);c.fillStyle='#172554';c.font='bold 18px sans-serif';c.fillText('👑 '+boss.name+' '+boss.hp+'/'+boss.max,300,23)}ps.forEach(p=>{c.globalAlpha=p.down?.35:(p.inv&&Math.floor(p.inv/6)%2?.4:1);peng(p);c.globalAlpha=1});if(resp){c.fillStyle='#172554dd';c.fillRect(0,0,800,420);c.fillStyle='white';c.textAlign='center';c.font='bold 34px sans-serif';c.fillText('💀 全員ダウン！',400,175);c.font='bold 25px sans-serif';c.fillText('🚩 ボス戦の前から復活！',400,220);c.fillText('👑 ボスHPも満タン！',400,260);c.textAlign='left'}}
function loop(){update();draw();requestAnimationFrame(loop)}$('music').onclick=()=>{music=!music;$('music').textContent=music?'🎵 ON':'🔇 OFF';if(music)tone(659)};$('pause').onclick=()=>{mode=mode==='play'?'pause':'play';$('pause').textContent=mode==='play'?'⏸️':'▶️'};drawMap();loop()})();
</script></body></html>
